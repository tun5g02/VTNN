<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Galaxy Heart - For My Wife</title>
    <!-- 1. THÊM FONT CHỮ NGHỆ THUẬT -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Arial', sans-serif;
        }
        canvas { display: block; }
        #title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #ff69b4;
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ff69b4;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        /* 2. NÂNG CẤP CSS CHO DÒNG CHỮ RÕ NÉT VÀ ĐẸP HƠN */
        #sorry-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            /* Dùng font nghệ thuật Pacifico */
            font-family: 'Pacifico', cursive; 
            font-size: 50px;
            text-align: center;
            /* Hiệu ứng tỏa sáng Neon nhiều lớp */
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff1493,
                0 0 40px #ff1493,
                0 0 80px #ff1493;
            opacity: 0;
            pointer-events: none;
            width: 100%;
            z-index: 20;
            line-height: 1.5;
        }

        .sub-text {
            font-family: 'Arial', sans-serif;
            font-size: 22px;
            display: block;
            margin-top: 10px;
            font-weight: normal;
            font-style: italic;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff1493;
        }
    </style>
</head>
<body>
    <div id="title"></div>
    <!-- Nơi chứa dòng chữ gõ tự động -->
    <div id="sorry-text"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, stars, heartParticles;
        const particleCount = 25000;
        const duration = 3.5; 
        
        let originPositions = new Float32Array(particleCount * 3);
        let destinations = new Float32Array(particleCount * 3);
        let progress = 0;
        let startTime = null;
        let textShown = false;

        // 3. HÀM XỬ LÝ HIỆU ỨNG GÕ CHỮ
        function typeWriter(text, subText, elementId, speed) {
            let i = 0;
            let elem = document.getElementById(elementId);
            elem.style.opacity = "1";
            
            function type() {
                if (i < text.length) {
                    elem.innerHTML = text.substring(0, i + 1);
                    i++;
                    setTimeout(type, speed);
                } else {
                    // Sau khi gõ xong dòng chính, hiện dòng phụ
                    elem.innerHTML += `<span class="sub-text">${subText}</span>`;
                }
            }
            type();
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.z = 400;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starVertices = [];
            for (let i = 0; i < 15000; i++) {
                starVertices.push((Math.random() - 0.5) * 2500, (Math.random() - 0.5) * 2500, (Math.random() - 0.5) * 2500);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
            scene.add(stars);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const t = Math.random() * Math.PI * 2;
                const r = Math.pow(Math.random(), 0.5); 
                
                const dx = 16 * Math.pow(Math.sin(t), 3);
                const dy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const dz = (Math.random() - 0.5) * 10;

                destinations[i3] = dx * r * 10;
                destinations[i3 + 1] = dy * r * 10;
                destinations[i3 + 2] = dz * r * 5;

                originPositions[i3] = (Math.random() - 0.5) * 2000;
                originPositions[i3 + 1] = (Math.random() - 0.5) * 2000;
                originPositions[i3 + 2] = (Math.random() - 0.5) * 2000;
            }

            const heartGeometry = new THREE.BufferGeometry();
            heartGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(originPositions), 3));

            const heartMaterial = new THREE.PointsMaterial({
                color: 0xff69b4,
                size: 1.5,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0
            });

            heartParticles = new THREE.Points(heartGeometry, heartMaterial);
            scene.add(heartParticles);

            requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000;
            
            requestAnimationFrame(animate);

            if (progress < 1) {
                progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const posAttr = heartParticles.geometry.attributes.position;

                for (let i = 0; i < particleCount; i++) {
                    const i3 = i * 3;
                    posAttr.array[i3] = originPositions[i3] + (destinations[i3] - originPositions[i3]) * ease;
                    posAttr.array[i3 + 1] = originPositions[i3 + 1] + (destinations[i3 + 1] - originPositions[i3 + 1]) * ease;
                    posAttr.array[i3 + 2] = originPositions[i3 + 2] + (destinations[i3 + 2] - originPositions[i3 + 2]) * ease;
                }
                posAttr.needsUpdate = true;
                heartParticles.material.opacity = progress;
            } else {
                const time = Date.now() * 0.002;
                const pulse = 1 + Math.sin(time * 3) * 0.04; 
                heartParticles.scale.set(pulse, pulse, pulse);

                // 4. KÍCH HOẠT HIỆU ỨNG CHỮ KHI TRÁI TIM TỤ XONG
                if (!textShown) {
                    document.getElementById('title').style.opacity = '0';
                    // Gọi hàm đánh máy (Nội dung, dòng phụ, ID phần tử, tốc độ gõ)
                    typeWriter("Anh xin lỗi vợ yêu  ❤️", "Đừng giận anh nữa nhé!", "sorry-text", 120);
                    textShown = true;
                }
            }

            stars.rotation.y -= 0.0003;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
